<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Dusra Brain</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            background: #f7f7f8;
            color: #202123;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            height: 64px;

            background: #ffffff;

            border-bottom: 1px solid #e5e5e5;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 24px;

            position: sticky;
            top: 0;

            z-index: 20;
        }

        .logo {
            font-size: 20px;
            font-weight: 700;
            color: #111827;
        }

        .memory-button {
            border: 1px solid #d1d5db;

            background: #ffffff;

            color: #111827;

            padding: 9px 14px;

            border-radius: 10px;

            cursor: pointer;

            font-size: 14px;

            font-weight: 600;
        }

        .memory-button:hover {
            background: #f3f4f6;
        }


        /* =========================
           CHAT
        ========================= */

        .chat-container {
            max-width: 900px;

            margin: 0 auto;

            min-height:
                calc(100vh - 64px);

            display: flex;

            flex-direction: column;
        }

        .messages {
            flex: 1;

            padding:
                30px 20px 130px;
        }

        .message {
            margin-bottom: 22px;

            line-height: 1.6;
        }

        .message.user {
            text-align: right;
        }

        .message-bubble {
            display: inline-block;

            max-width: 80%;

            padding: 12px 16px;

            border-radius: 14px;

            white-space: pre-wrap;

            word-wrap: break-word;
        }

        .message.user
        .message-bubble {
            background: #111827;

            color: #ffffff;
        }

        .message.assistant
        .message-bubble {
            background: #ffffff;

            border: 1px solid #e5e7eb;

            color: #202123;
        }


        /* =========================
           INPUT
        ========================= */

        .input-area {
            position: fixed;

            bottom: 0;

            left: 0;

            right: 0;

            background:
                rgba(
                    247,
                    247,
                    248,
                    0.96
                );

            border-top:
                1px solid #e5e5e5;

            padding: 14px 20px;

            z-index: 15;
        }

        .input-wrapper {
            max-width: 900px;

            margin: 0 auto;

            display: flex;

            gap: 10px;
        }

        textarea {
            flex: 1;

            resize: none;

            min-height: 50px;

            max-height: 160px;

            border:
                1px solid #d1d5db;

            border-radius: 12px;

            padding: 14px;

            font-family: inherit;

            font-size: 15px;

            outline: none;

            background: #ffffff;
        }

        textarea:focus {
            border-color: #9ca3af;
        }

        .send-button {
            width: 90px;

            border: none;

            border-radius: 12px;

            background: #111827;

            color: #ffffff;

            font-size: 14px;

            font-weight: 600;

            cursor: pointer;
        }

        .send-button:hover {
            background: #000000;
        }

        .send-button:disabled {
            opacity: 0.5;

            cursor: not-allowed;
        }


        /* =========================
           DASHBOARD
        ========================= */

        #memoryDashboard {
            display: none;

            max-width: 1100px;

            margin: 0 auto;

            padding: 30px 20px 60px;
        }

        .dashboard-header {
            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-bottom: 25px;
        }

        .dashboard-title {
            margin: 0;

            font-size: 28px;

            font-weight: 700;
        }

        .back-button {
            border:
                1px solid #d1d5db;

            background: #ffffff;

            padding: 9px 14px;

            border-radius: 10px;

            cursor: pointer;

            font-size: 14px;

            font-weight: 600;
        }

        .back-button:hover {
            background: #f3f4f6;
        }


        /* =========================
           STATS
        ========================= */

        .memory-stats {
            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 15px;

            margin-bottom: 30px;
        }

        .stat-card {
            background: #ffffff;

            border:
                1px solid #e5e7eb;

            border-radius: 14px;

            padding: 20px;
        }

        .stat-label {
            color: #6b7280;

            font-size: 13px;

            margin-bottom: 7px;
        }

        .stat-value {
            font-size: 27px;

            font-weight: 700;
        }


        /* =========================
           MEMORY LIST
        ========================= */

        .memory-list {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 18px;
        }

        .memory-card {
            background: #ffffff;

            border:
                1px solid #e5e7eb;

            border-radius: 15px;

            padding: 20px;
        }

        .memory-card:hover {
            border-color: #d1d5db;
        }

        .memory-subject {
            font-size: 17px;

            font-weight: 700;

            margin-bottom: 5px;
        }

        .memory-category {
            display: inline-block;

            font-size: 12px;

            color: #4b5563;

            background: #f3f4f6;

            border-radius: 999px;

            padding: 4px 9px;

            margin-bottom: 13px;
        }

        .memory-text {
            font-size: 15px;

            line-height: 1.55;

            color: #374151;

            margin-bottom: 15px;
        }

        .memory-meta {
            font-size: 12px;

            color: #6b7280;
        }

        .importance {
            font-weight: 700;

            color: #111827;
        }


        /* =========================
           MEMORY ACTIONS
        ========================= */

        .memory-actions {
            display: flex;

            gap: 8px;

            margin-top: 15px;
        }

        .edit-memory,
        .delete-memory {
            padding: 7px 12px;

            border-radius: 9px;

            font-size: 13px;

            font-weight: 600;

            cursor: pointer;
        }

        .edit-memory {
            background: #ffffff;

            color: #111827;

            border:
                1px solid #d1d5db;
        }

        .edit-memory:hover {
            background: #f3f4f6;
        }

        .delete-memory {
            background: #ffffff;

            color: #b91c1c;

            border:
                1px solid #fecaca;
        }

        .delete-memory:hover {
            background: #fef2f2;
        }


        /* =========================
           EMPTY
        ========================= */

        .empty-memory {
            grid-column: 1 / -1;

            background: #ffffff;

            border:
                1px solid #e5e7eb;

            border-radius: 15px;

            padding: 40px;

            text-align: center;

            color: #6b7280;
        }

        .loading {
            color: #6b7280;

            padding: 30px;

            text-align: center;
        }


        /* =========================
           EDIT MODAL
        ========================= */

        #editModal {
            display: none;

            position: fixed;

            inset: 0;

            background:
                rgba(
                    0,
                    0,
                    0,
                    0.45
                );

            z-index: 100;

            align-items: center;

            justify-content: center;

            padding: 20px;
        }

        .edit-modal-box {
            width: 100%;

            max-width: 600px;

            max-height: 90vh;

            overflow-y: auto;

            background: #ffffff;

            border-radius: 18px;

            padding: 25px;

            box-shadow:
                0 20px 60px
                rgba(
                    0,
                    0,
                    0,
                    0.2
                );
        }

        .edit-modal-title {
            margin: 0 0 20px;

            font-size: 22px;

            font-weight: 700;
        }

        .form-group {
            margin-bottom: 17px;
        }

        .form-group label {
            display: block;

            font-size: 13px;

            font-weight: 600;

            color: #374151;

            margin-bottom: 7px;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;

            border:
                1px solid #d1d5db;

            border-radius: 10px;

            padding: 11px 12px;

            font-family: inherit;

            font-size: 14px;

            outline: none;

            background: #ffffff;
        }

        .form-group textarea {
            min-height: 110px;

            resize: vertical;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            border-color: #6b7280;
        }

        .importance-row {
            display: flex;

            align-items: center;

            gap: 12px;
        }

        .importance-row input {
            flex: 1;
        }

        #importanceValue {
            width: 35px;

            font-weight: 700;

            text-align: center;
        }

        .modal-actions {
            display: flex;

            justify-content: flex-end;

            gap: 10px;

            margin-top: 25px;
        }

        .cancel-button,
        .save-button {
            padding: 10px 16px;

            border-radius: 10px;

            cursor: pointer;

            font-size: 14px;

            font-weight: 600;
        }

        .cancel-button {
            background: #ffffff;

            color: #374151;

            border:
                1px solid #d1d5db;
        }

        .cancel-button:hover {
            background: #f3f4f6;
        }

        .save-button {
            background: #111827;

            color: #ffffff;

            border: none;
        }

        .save-button:hover {
            background: #000000;
        }

        .save-button:disabled {
            opacity: 0.5;

            cursor: not-allowed;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            header {
                padding: 0 15px;
            }

            .logo {
                font-size: 18px;
            }

            .memory-button {
                padding: 8px 10px;

                font-size: 13px;
            }

            .memory-stats {
                grid-template-columns:
                    repeat(2, 1fr);
            }

            .memory-list {
                grid-template-columns: 1fr;
            }

            .message-bubble {
                max-width: 90%;
            }

            .dashboard-title {
                font-size: 23px;
            }

            .input-area {
                padding: 10px;
            }

            .send-button {
                width: 70px;
            }

            .edit-modal-box {
                padding: 20px;
            }

        }

    </style>
</head>


<body>


    <!-- ======================================================
         HEADER
    ======================================================= -->

    <header>

        <div class="logo">
            🧠 Dusra Brain
        </div>

        <button
            id="memoryButton"
            class="memory-button"
        >
            🧠 My Memory
        </button>

    </header>


    <!-- ======================================================
         CHAT
    ======================================================= -->

    <main
        id="chatContainer"
        class="chat-container"
    >

        <div
            id="messages"
            class="messages"
        >

            <div class="message assistant">

                <div class="message-bubble">

                    Hello! I am Dusra Brain 🧠

                    <br><br>

                    Tell me something you want me to remember,
                    or ask me anything.

                </div>

            </div>

        </div>

    </main>


    <!-- ======================================================
         INPUT
    ======================================================= -->

    <div
        id="inputArea"
        class="input-area"
    >

        <div class="input-wrapper">

            <textarea
                id="messageInput"
                placeholder="Message Dusra Brain..."
                rows="1"
            ></textarea>

            <button
                id="sendButton"
                class="send-button"
            >
                Send
            </button>

        </div>

    </div>


    <!-- ======================================================
         MEMORY DASHBOARD
    ======================================================= -->

    <section
        id="memoryDashboard"
    >

        <div class="dashboard-header">

            <h1 class="dashboard-title">
                🧠 My Memory
            </h1>

            <button
                id="backButton"
                class="back-button"
            >
                ← Back to Chat
            </button>

        </div>


        <!-- STATS -->

        <div class="memory-stats">

            <div class="stat-card">

                <div class="stat-label">
                    Total Memories
                </div>

                <div
                    id="totalMemories"
                    class="stat-value"
                >
                    0
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-label">
                    Projects
                </div>

                <div
                    id="projectMemories"
                    class="stat-value"
                >
                    0
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-label">
                    Businesses
                </div>

                <div
                    id="businessMemories"
                    class="stat-value"
                >
                    0
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-label">
                    High Importance
                </div>

                <div
                    id="importantMemories"
                    class="stat-value"
                >
                    0
                </div>

            </div>

        </div>


        <!-- MEMORY LIST -->

        <div
            id="memoryList"
            class="memory-list"
        >

            <div class="loading">
                Loading memories...
            </div>

        </div>

    </section>


    <!-- ======================================================
         EDIT MEMORY MODAL
    ======================================================= -->

    <div
        id="editModal"
    >

        <div
            class="edit-modal-box"
        >

            <h2
                class="edit-modal-title"
            >
                ✏️ Edit Memory
            </h2>


            <!-- MEMORY -->

            <div class="form-group">

                <label for="editMemory">
                    Memory
                </label>

                <textarea
                    id="editMemory"
                    placeholder="Memory"
                ></textarea>

            </div>


            <!-- SUBJECT -->

            <div class="form-group">

                <label for="editSubject">
                    Subject
                </label>

                <input
                    id="editSubject"
                    type="text"
                    placeholder="Subject"
                >

            </div>


            <!-- CATEGORY -->

            <div class="form-group">

                <label for="editCategory">
                    Category
                </label>

                <select
                    id="editCategory"
                >

                    <option value="personal">
                        Personal
                    </option>

                    <option value="preference">
                        Preference
                    </option>

                    <option value="project">
                        Project
                    </option>

                    <option value="business">
                        Business
                    </option>

                    <option value="goal">
                        Goal
                    </option>

                    <option value="relationship">
                        Relationship
                    </option>

                    <option value="work">
                        Work
                    </option>

                    <option value="decision">
                        Decision
                    </option>

                    <option value="instruction">
                        Instruction
                    </option>

                    <option value="general">
                        General
                    </option>

                </select>

            </div>


            <!-- IMPORTANCE -->

            <div class="form-group">

                <label for="editImportance">
                    Importance
                </label>

                <div
                    class="importance-row"
                >

                    <input
                        id="editImportance"
                        type="range"
                        min="1"
                        max="10"
                        value="5"
                    >

                    <span
                        id="importanceValue"
                    >
                        5
                    </span>

                </div>

            </div>


            <!-- ACTIONS -->

            <div class="modal-actions">

                <button
                    id="cancelEditButton"
                    class="cancel-button"
                >
                    Cancel
                </button>

                <button
                    id="saveEditButton"
                    class="save-button"
                >
                    Save Changes
                </button>

            </div>

        </div>

    </div>


    <script>

        /* ====================================================
           ELEMENTS
        ==================================================== */

        const messages =
            document.getElementById(
                "messages"
            );

        const messageInput =
            document.getElementById(
                "messageInput"
            );

        const sendButton =
            document.getElementById(
                "sendButton"
            );

        const memoryButton =
            document.getElementById(
                "memoryButton"
            );

        const backButton =
            document.getElementById(
                "backButton"
            );

        const chatContainer =
            document.getElementById(
                "chatContainer"
            );

        const inputArea =
            document.getElementById(
                "inputArea"
            );

        const memoryDashboard =
            document.getElementById(
                "memoryDashboard"
            );

        const memoryList =
            document.getElementById(
                "memoryList"
            );

        const editModal =
            document.getElementById(
                "editModal"
            );

        const editMemory =
            document.getElementById(
                "editMemory"
            );

        const editSubject =
            document.getElementById(
                "editSubject"
            );

        const editCategory =
            document.getElementById(
                "editCategory"
            );

        const editImportance =
            document.getElementById(
                "editImportance"
            );

        const importanceValue =
            document.getElementById(
                "importanceValue"
            );

        const cancelEditButton =
            document.getElementById(
                "cancelEditButton"
            );

        const saveEditButton =
            document.getElementById(
                "saveEditButton"
            );


        let editingMemoryId = null;


        /* ====================================================
           ADD CHAT MESSAGE
        ==================================================== */

        function addMessage(
            text,
            role
        ) {

            const message =
                document.createElement(
                    "div"
                );

            message.className =
                "message " + role;


            const bubble =
                document.createElement(
                    "div"
                );

            bubble.className =
                "message-bubble";

            bubble.textContent =
                text;


            message.appendChild(
                bubble
            );

            messages.appendChild(
                message
            );


            window.scrollTo(
                0,
                document.body.scrollHeight
            );

        }


        /* ====================================================
           SEND MESSAGE
        ==================================================== */

        async function sendMessage() {

            const message =
                messageInput.value.trim();


            if (!message) {
                return;
            }


            addMessage(
                message,
                "user"
            );


            messageInput.value = "";

            sendButton.disabled = true;


            const loading =
                document.createElement(
                    "div"
                );

            loading.className =
                "message assistant";

            loading.id =
                "loadingMessage";


            const loadingBubble =
                document.createElement(
                    "div"
                );

            loadingBubble.className =
                "message-bubble";

            loadingBubble.textContent =
                "Thinking...";


            loading.appendChild(
                loadingBubble
            );

            messages.appendChild(
                loading
            );


            try {

                const response =
                    await fetch(
                        "/api",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                message: message
                            })
                        }
                    );


                const data =
                    await response.json();


                const loadingElement =
                    document.getElementById(
                        "loadingMessage"
                    );


                if (loadingElement) {
                    loadingElement.remove();
                }


                if (!response.ok) {

                    throw new Error(
                        data.error ||
                        "Something went wrong."
                    );

                }


                addMessage(
                    data.reply ||
                    data.response ||
                    "I couldn't generate a response.",
                    "assistant"
                );


            } catch (error) {

                const loadingElement =
                    document.getElementById(
                        "loadingMessage"
                    );


                if (loadingElement) {
                    loadingElement.remove();
                }


                addMessage(
                    "Error: " +
                    error.message,
                    "assistant"
                );

            }


            sendButton.disabled =
                false;

            messageInput.focus();

        }


        /* ====================================================
           SEND BUTTON
        ==================================================== */

        sendButton.addEventListener(
            "click",
            sendMessage
        );


        /* ====================================================
           ENTER TO SEND
        ==================================================== */

        messageInput.addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key === "Enter" &&
                    !event.shiftKey
                ) {

                    event.preventDefault();

                    sendMessage();

                }

            }
        );


        /* ====================================================
           ESCAPE HTML
        ==================================================== */

        function escapeHtml(
            value
        ) {

            const div =
                document.createElement(
                    "div"
                );

            div.textContent =
                value == null
                    ? ""
                    : String(value);

            return div.innerHTML;

        }


        /* ====================================================
           LOAD MEMORIES
        ==================================================== */

        async function loadMemories() {

            memoryList.innerHTML =
                `
                    <div class="loading">
                        Loading memories...
                    </div>
                `;


            try {

                const response =
                    await fetch(
                        "/api?memories=true"
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.error ||
                        "Unable to load memories."
                    );

                }


                const memories =
                    data.memories || [];


                /* STATS */

                const total =
                    memories.length;


                const projects =
                    memories.filter(
                        memory =>
                            String(
                                memory.category ||
                                ""
                            ).toLowerCase()
                            === "project"
                    ).length;


                const businesses =
                    memories.filter(
                        memory =>
                            String(
                                memory.category ||
                                ""
                            ).toLowerCase()
                            === "business"
                    ).length;


                const important =
                    memories.filter(
                        memory =>
                            Number(
                                memory.importance ||
                                0
                            ) >= 8
                    ).length;


                document.getElementById(
                    "totalMemories"
                ).textContent =
                    total;


                document.getElementById(
                    "projectMemories"
                ).textContent =
                    projects;


                document.getElementById(
                    "businessMemories"
                ).textContent =
                    businesses;


                document.getElementById(
                    "importantMemories"
                ).textContent =
                    important;


                /* EMPTY */

                if (memories.length === 0) {

                    memoryList.innerHTML =
                        `
                            <div
                                class="empty-memory"
                            >

                                🧠

                                <br><br>

                                Dusra Brain doesn't
                                remember anything yet.

                                <br><br>

                                Start chatting and
                                important information
                                will be remembered.

                            </div>
                        `;

                    return;

                }


                /* MEMORY CARDS */

                memoryList.innerHTML =
                    memories
                        .map(
                            memory => {

                                const created =
                                    memory.created_at
                                        ? new Date(
                                            memory.created_at
                                        ).toLocaleString()
                                        : "";


                                const subject =
                                    memory.subject ||
                                    "General";


                                const category =
                                    memory.category ||
                                    "general";


                                const importance =
                                    Number(
                                        memory.importance ||
                                        0
                                    );


                                return `

                                    <div
                                        class="memory-card"
                                    >

                                        <div
                                            class="memory-subject"
                                        >
                                            ${escapeHtml(
                                                subject
                                            )}
                                        </div>


                                        <div
                                            class="memory-category"
                                        >
                                            ${escapeHtml(
                                                category
                                            )}
                                        </div>


                                        <div
                                            class="memory-text"
                                        >
                                            ${escapeHtml(
                                                memory.memory
                                            )}
                                        </div>


                                        <div
                                            class="memory-meta"
                                        >

                                            Importance:

                                            <span
                                                class="importance"
                                            >
                                                ${importance}/10
                                            </span>

                                            &nbsp; • &nbsp;

                                            ${escapeHtml(
                                                created
                                            )}

                                        </div>


                                        <div
                                            class="memory-actions"
                                        >

                                            <button
                                                class="edit-memory"
                                                onclick="openEditMemory(${Number(
                                                    memory.id
                                                )}, ${JSON.stringify(
                                                    memory.memory || ""
                                                )}, ${JSON.stringify(
                                                    memory.subject || "general"
                                                )}, ${JSON.stringify(
                                                    memory.category || "general"
                                                )}, ${importance})"
                                            >
                                                ✏️ Edit
                                            </button>


                                            <button
                                                class="delete-memory"
                                                onclick="deleteMemory(${Number(
                                                    memory.id
                                                )})"
                                            >
                                                🗑️ Delete
                                            </button>

                                        </div>

                                    </div>

                                `;

                            }
                        )
                        .join("");

            } catch (error) {

                memoryList.innerHTML =
                    `
                        <div
                            class="empty-memory"
                        >

                            Unable to load memories.

                            <br><br>

                            ${escapeHtml(
                                error.message
                            )}

                        </div>
                    `;

            }

        }


        /* ====================================================
           OPEN EDIT MEMORY
        ==================================================== */

        function openEditMemory(
            memoryId,
            memory,
            subject,
            category,
            importance
        ) {

            editingMemoryId =
                memoryId;


            editMemory.value =
                memory || "";


            editSubject.value =
                subject || "general";


            editCategory.value =
                category || "general";


            editImportance.value =
                importance || 5;


            importanceValue.textContent =
                importance || 5;


            editModal.style.display =
                "flex";


            setTimeout(
                function() {

                    editMemory.focus();

                },
                100
            );

        }


        /* ====================================================
           IMPORTANCE SLIDER
        ==================================================== */

        editImportance.addEventListener(
            "input",
            function() {

                importanceValue.textContent =
                    editImportance.value;

            }
        );


        /* ====================================================
           CLOSE EDIT MODAL
        ==================================================== */

        function closeEditModal() {

            editModal.style.display =
                "none";

            editingMemoryId =
                null;

        }


        cancelEditButton.addEventListener(
            "click",
            closeEditModal
        );


        /* ====================================================
           CLICK OUTSIDE MODAL
        ==================================================== */

        editModal.addEventListener(
            "click",
            function(event) {

                if (
                    event.target ===
                    editModal
                ) {

                    closeEditModal();

                }

            }
        );


        /* ====================================================
           ESCAPE CLOSES MODAL
        ==================================================== */

        document.addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key === "Escape" &&
                    editModal.style.display ===
                        "flex"
                ) {

                    closeEditModal();

                }

            }
        );


        /* ====================================================
           SAVE EDITED MEMORY
        ==================================================== */

        saveEditButton.addEventListener(
            "click",
            async function() {

                if (!editingMemoryId) {

                    return;

                }


                const memory =
                    editMemory.value.trim();


                const subject =
                    editSubject.value.trim();


                const category =
                    editCategory.value;


                const importance =
                    Number(
                        editImportance.value
                    );


                if (!memory) {

                    alert(
                        "Memory text cannot be empty."
                    );

                    return;

                }


                saveEditButton.disabled =
                    true;

                saveEditButton.textContent =
                    "Saving...";


                try {

                    const response =
                        await fetch(
                            "/api",
                            {
                                method: "PUT",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body: JSON.stringify({
                                    id:
                                        editingMemoryId,

                                    memory:
                                        memory,

                                    subject:
                                        subject ||
                                        "general",

                                    category:
                                        category ||
                                        "general",

                                    importance:
                                        importance
                                })
                            }
                        );


                    const data =
                        await response.json();


                    if (
                        !response.ok ||
                        !data.updated
                    ) {

                        throw new Error(
                            data.error ||
                            "Unable to update memory."
                        );

                    }


                    closeEditModal();


                    await loadMemories();


                } catch (error) {

                    alert(
                        "Could not update memory:\n\n" +
                        error.message
                    );

                }


                saveEditButton.disabled =
                    false;

                saveEditButton.textContent =
                    "Save Changes";

            }
        );


        /* ====================================================
           DELETE MEMORY
        ==================================================== */

        async function deleteMemory(
            memoryId
        ) {

            const confirmed =
                confirm(
                    "Are you sure you want to delete this memory?"
                );


            if (!confirmed) {
                return;
            }


            try {

                const response =
                    await fetch(
                        "/api?memory_id=" +
                        encodeURIComponent(
                            memoryId
                        ),
                        {
                            method: "DELETE"
                        }
                    );


                const data =
                    await response.json();


                if (
                    !response.ok ||
                    !data.deleted
                ) {

                    throw new Error(
                        data.error ||
                        "Unable to delete memory."
                    );

                }


                await loadMemories();


            } catch (error) {

                alert(
                    "Could not delete memory:\n\n" +
                    error.message
                );

            }

        }


        /* ====================================================
           OPEN MEMORY DASHBOARD
        ==================================================== */

        memoryButton.addEventListener(
            "click",
            async function() {

                chatContainer.style.display =
                    "none";

                inputArea.style.display =
                    "none";

                memoryDashboard.style.display =
                    "block";


                await loadMemories();

            }
        );


        /* ====================================================
           BACK TO CHAT
        ==================================================== */

        backButton.addEventListener(
            "click",
            function() {

                memoryDashboard.style.display =
                    "none";

                chatContainer.style.display =
                    "flex";

                inputArea.style.display =
                    "block";

                messageInput.focus();

            }
        );

    </script>

</body>
</html>
