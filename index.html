<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dusra Brain</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                Roboto, Helvetica, Arial, sans-serif;
            background: #f7f7f8;
            color: #202123;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            height: 64px;
            background: white;
            border-bottom: 1px solid #e5e5e5;
            display: flex;
            align-items: center;
            padding: 0 24px;
            font-size: 20px;
            font-weight: 600;
        }

        .logo {
            margin-right: 10px;
        }

        main {
            flex: 1;
            overflow-y: auto;
            padding: 30px 20px 140px;
        }

        .welcome {
            max-width: 760px;
            margin: 80px auto;
            text-align: center;
        }

        .welcome h1 {
            font-size: 42px;
            margin-bottom: 12px;
        }

        .welcome p {
            color: #6b7280;
            font-size: 18px;
        }

        .messages {
            max-width: 760px;
            margin: 0 auto;
        }

        .message {
            margin: 18px 0;
            padding: 16px 20px;
            border-radius: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .user {
            background: #e8f0fe;
            margin-left: 80px;
        }

        .assistant {
            background: white;
            border: 1px solid #e5e5e5;
            margin-right: 80px;
        }

        .input-area {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(247, 247, 248, 0.96);
            padding: 18px 20px;
            border-top: 1px solid #e5e5e5;
        }

        .input-box {
            max-width: 760px;
            margin: auto;
            display: flex;
            gap: 10px;
        }

        textarea {
            flex: 1;
            resize: none;
            min-height: 52px;
            max-height: 160px;
            padding: 14px 16px;
            border: 1px solid #d1d5db;
            border-radius: 14px;
            font-size: 16px;
            outline: none;
            background: white;
        }

        textarea:focus {
            border-color: #999;
        }

        button {
            width: 90px;
            border: none;
            border-radius: 14px;
            background: #111827;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .thinking {
            color: #6b7280;
            font-style: italic;
        }

        @media (max-width: 700px) {
            .welcome h1 {
                font-size: 32px;
            }

            .user {
                margin-left: 20px;
            }

            .assistant {
                margin-right: 20px;
            }
        }
    </style>
</head>

<body>

<header>
    <span class="logo">🧠</span>
    Dusra Brain
</header>

<main id="chat">
    <div class="welcome" id="welcome">
        <h1>Dusra Brain</h1>
        <p>Your personal AI brain, powered by memory.</p>
    </div>

    <div class="messages" id="messages"></div>
</main>

<div class="input-area">
    <div class="input-box">

        <textarea
            id="message"
            placeholder="Ask Dusra Brain anything..."
            rows="1"
        ></textarea>

        <button id="send">Send</button>

    </div>
</div>

<script>

const messageInput = document.getElementById("message");
const sendButton = document.getElementById("send");
const messages = document.getElementById("messages");
const welcome = document.getElementById("welcome");

function addMessage(text, type) {

    welcome.style.display = "none";

    const div = document.createElement("div");

    div.className = "message " + type;

    div.textContent = text;

    messages.appendChild(div);

    window.scrollTo({
        top: document.body.scrollHeight,
        behavior: "smooth"
    });

    return div;
}

async function sendMessage() {

    const message = messageInput.value.trim();

    if (!message) {
        return;
    }

    addMessage(message, "user");

    messageInput.value = "";

    sendButton.disabled = true;

    const thinking = addMessage(
        "Dusra Brain is thinking...",
        "assistant thinking"
    );

    try {

        const response = await fetch(
            "/api",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    message: message
                })
            }
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                data.error || "Something went wrong."
            );
        }

        thinking.remove();

        addMessage(
            data.response || "No response received.",
            "assistant"
        );

    } catch (error) {

        thinking.textContent =
            "Sorry, something went wrong: " +
            error.message;

    } finally {

        sendButton.disabled = false;

        messageInput.focus();
    }
}

sendButton.addEventListener(
    "click",
    sendMessage
);

messageInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();
        }
    }
);

</script>

</body>
</html>
